# Render Blueprint for the API (https://render.com/docs/blueprint-spec).
# The web app is deployed separately to GitHub Pages (.github/workflows/deploy-web.yml).
services:
  - type: web
    name: book-the-court-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm ci && npm run build -w api
    startCommand: npm run start:prod -w api
    healthCheckPath: /api/health
    # Deploy only after the CI checks on GitHub have passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        sync: false # entered once in the Render dashboard (Neon connection string)
      - key: JWT_SECRET
        generateValue: true # random value generated by Render
      - key: CORS_ORIGINS
        value: https://dusanv-labs.github.io
      - key: ANTHROPIC_API_KEY
        sync: false # entered once in the Render dashboard; without it the AI assistant is switched off
      - key: STRIPE_SECRET_KEY
        sync: false # Stripe test mode key (sk_test_...), entered in the Render dashboard; without it players pay at the venue
      - key: STRIPE_WEBHOOK_SECRET
        sync: false # signing secret of the Stripe webhook endpoint (whsec_...), entered in the Render dashboard
      - key: WEB_URL
        value: https://dusanv-labs.github.io/book-the-court/ # Stripe sends players back here after paying
