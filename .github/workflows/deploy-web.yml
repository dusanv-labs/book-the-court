name: Deploy web app

on:
  push:
    branches: [main]
    paths: ['web/**', 'package-lock.json', '.github/workflows/deploy-web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - name: Check configuration
        run: test -n "${{ vars.API_URL }}" || (echo "Repository variable API_URL is not set" && exit 1)
      - run: npm ci
      - run: npm run test -w web
      - run: npm run build -w web
        env:
          VITE_API_URL: ${{ vars.API_URL }}
          VITE_BASE: /book-the-court/
          VITE_DEMO_EMAIL: ${{ vars.DEMO_ADMIN_EMAIL }}
          VITE_DEMO_PASSWORD: ${{ vars.DEMO_ADMIN_PASSWORD }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
